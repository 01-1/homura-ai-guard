name: org-guard
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: guard, cancel-in-progress: false}
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./guard.sh
        env:
          GH_TOKEN: ${{ secrets.GUARD_TOKEN }}
          ORG: homura-ai
          BOT: meowc-at
      # GitHub disables schedules after 60 days without commits; commit monthly.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
